<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UXL prototype</title>
    <link rel="stylesheet" href="./uxl.css" />
    <style>
      body {
        margin: 0;
        background: #2b2b2b;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        width: 100vw;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <script src="./uxl.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const key = params.get("key");
        // Prefer explicit one-shot key if provided, otherwise render the latest prototype from localStorage ("uxl-proto:last").
        window.UXL.renderPrototypeFromStorageKeyOrLast(key);
      })();
    </script>
  </body>
</html>
